name: Redirect GitHub Pages to Vercel

# The website is hosted on Vercel (https://project-beatrice.vercel.app).
# This keeps the old address, https://project-beatrice-v2.github.io/Beatrice-website/,
# working by publishing a tiny page that forwards every path to the same path on Vercel.

on:
  push:
    branches: [main]
    paths: [pages-redirect/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish-redirect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
